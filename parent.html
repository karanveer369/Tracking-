<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Parent Portal - Fail-Safe Edition</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0284c7" />

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b1329; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header {
      background: #1e293b;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0284c7;
      flex-shrink: 0;
    }
    .header-title { font-size: 1rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }

    .distance-hud {
      background: #0f172a;
      border: 1px solid #0284c7;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .form-panel {
      background: #1e293b;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
      z-index: 500;
      flex-wrap: wrap;
    }
    input, select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      flex: 1;
      min-width: 110px;
    }
    input:focus, select:focus { outline: 2px solid #38bdf8; }

    button.btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      transition: 0.15s;
    }
    button.btn-primary { background: #0284c7; color: white; flex: 2; }
    button.btn-gps { background: #334155; color: #38bdf8; border: 1px solid #0284c7; }
    button.btn-test { background: #7c3aed; color: white; }
    button.btn-layer { background: #0f172a; color: #f59e0b; border: 1px solid #f59e0b; }
    button.btn:active { transform: scale(0.96); }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #0b1329;
      z-index: 1;
      transform: translateZ(0);
    }

    .custom-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate3d(-50%, -100%, 0);
      will-change: transform;
      pointer-events: none;
    }
    .marker-bubble {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.8);
    }
    .home-bubble { background: #2563eb; }
    .bus-bubble { background: #f59e0b; }
    
    .marker-tag {
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      margin-top: 3px;
      white-space: nowrap;
      border: 1px solid #475569;
    }

    .status-pill {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      max-width: 92%;
      text-align: center;
      pointer-events: none;
    }
    .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 1.2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    #alarmModal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      z-index: 999999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      animation: flash-red 0.8s infinite alternate;
    }
    @keyframes flash-red {
      0% { background: rgba(15, 23, 42, 0.95); }
      100% { background: rgba(185, 28, 28, 0.92); }
    }
    .alarm-box {
      background: #1e293b;
      border: 2px solid #ef4444;
      padding: 26px 20px;
      border-radius: 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .alarm-icon { font-size: 55px; animation: ring 0.4s infinite alternate; }
    @keyframes ring { 0% { transform: rotate(-12deg); } 100% { transform: rotate(12deg); } }
    .btn-stop-siren {
      background: #dc2626; color: white; border: 3px solid #ffffff; padding: 14px 20px;
      border-radius: 50px; font-size: 1.05rem; font-weight: 800; cursor: pointer; width: 100%;
    }
  </style>
</head>
<body onclick="forceUnlockAudio()">

  <div id="alarmModal">
    <div class="alarm-box">
      <div class="alarm-icon">🚨</div>
      <h2 style="color: #f87171; font-size: 1.4rem;">BUS AA GAYI HAI!</h2>
      <p id="alarmStudentText" style="color: #e2e8f0; font-size: 0.95rem;">Bachha taiyar rakhein, bus pickup point par hai.</p>
      <button class="btn-stop-siren" onclick="stopContinuousSiren()">🛑 SIREN BAND KAREIN</button>
    </div>
  </div>

  <header>
    <div class="header-title">👨‍👩‍👧 Parent Live Radar</div>
    <div class="distance-hud" id="distanceHud">Doori: -- m</div>
  </header>

  <div class="form-panel">
    <input type="text" id="studentName" placeholder="Bachhe ka Naam" value="Aarav Singh" required />
    <select id="alertThreshold" title="Siren Range">
      <option value="20" selected>🏠 Indoor Range (20 Meters)</option>
      <option value="50">🚗 Street Range (50 Meters)</option>
      <option value="100">🛣️ Road Range (100 Meters)</option>
    </select>
    <button class="btn btn-gps" onclick="fetchUltraAccurateGPS()">🎯 GPS</button>
    <button class="btn btn-primary" onclick="savePickupToSupabase()">🔒 Lock Pickup</button>
    <button class="btn btn-test" onclick="forceTestSiren()">🔊 Siren Test</button>
    <button class="btn btn-layer" onclick="toggleMapLayer()" id="layerBtn">🗺️ Normal</button>
  </div>

  <div id="map"></div>

  <div class="status-pill">
    <div class="dot"></div>
    <span id="statusText">System Ready. Pin drag karke 'Lock Pickup' dabayein.</span>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const SUPABASE_URL = "https://wavraoucbbabjzzzkzor.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdnJhb3VjYmJhYmp6enprem9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDE3MTQsImV4cCI6MjEwMzY3NzcxNH0.wYCB_LdoYkVywZrM27UHvpixsZ6qQbQrzd5hSpJSuoI";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let map = null, pickupMarker = null, busMarker = null, routeLine = null;
    let selectedPickupCoords = null;
    let isSatellite = true;
    let googleHybridLayer, googleStreetsLayer;

    // 60FPS Lerp Variables
    let busCurrentPos = null;
    let busTargetPos = null;
    let animFraction = 1;

    // Audio & Vibration System
    let audioCtx = null;
    let sirenTimer = null;
    let voiceTimer = null;
    let isSirenActive = false;
    let hasAlertFired = false;

    // Supabase Watchdog Reconnector
    let realtimeChannel = null;
    let lastHeartbeat = Date.now();

    function forceUnlockAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function startGuaranteedSiren(studentName) {
      if (isSirenActive) return;
      isSirenActive = true;
      forceUnlockAudio();

      document.getElementById('alarmStudentText').innerText = `Dhyan dein, ${studentName} ki bus pickup point par aa chuki hai!`;
      document.getElementById('alarmModal').style.display = 'flex';

      if ('vibrate' in navigator) {
        navigator.vibrate([500, 250, 500, 250, 500]);
      }

      function triggerDualTone() {
        if (!isSirenActive || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const now = audioCtx.currentTime;

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + 0.35);
          osc.frequency.exponentialRampToValueAtTime(450, now + 0.7);
          osc.frequency.exponentialRampToValueAtTime(950, now + 1.05);

          gain.gain.setValueAtTime(0.5, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 1.4);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 1.4);

          if ('vibrate' in navigator) navigator.vibrate([300, 150, 300]);
        } catch (e) {}
      }

      triggerDualTone();
      sirenTimer = setInterval(triggerDualTone, 1500);

      function speakHindiVoice() {
        if (!isSirenActive) return;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(`Dhyan dein, ${studentName} ki bus aa gayi hai.`);
          utterance.lang = 'hi-IN';
          window.speechSynthesis.speak(utterance);
        }
      }
      setTimeout(speakHindiVoice, 500);
      voiceTimer = setInterval(speakHindiVoice, 4500);
    }

    function stopContinuousSiren() {
      isSirenActive = false;
      if (sirenTimer) clearInterval(sirenTimer);
      if (voiceTimer) clearInterval(voiceTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if ('vibrate' in navigator) navigator.vibrate(0);
      document.getElementById('alarmModal').style.display = 'none';
      hasAlertFired = true;
    }

    function forceTestSiren() {
      forceUnlockAudio();
      hasAlertFired = false;
      const sName = document.getElementById('studentName').value.trim() || 'Aarav';
      startGuaranteedSiren(sName);
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        maxZoom: 20,
        preferCanvas: true,
        zoomAnimation: true,
        fadeAnimation: false
      }).setView([26.8467, 80.9462], 18);

      googleHybridLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      }).addTo(map);

      googleStreetsLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      });

      setTimeout(() => { if (map) map.invalidateSize(); }, 200);

      map.on('click', (e) => {
        placeDraggablePin(e.latlng.lat, e.latlng.lng);
      });

      fetchUltraAccurateGPS();
      listenToDriverBusRealtime();
      requestAnimationFrame(runSmoothGliderLoop);

      // Heartbeat Watchdog Loop
      setInterval(() => {
        if (Date.now() - lastHeartbeat > 10000) {
          listenToDriverBusRealtime();
        }
      }, 5000);
    }

    function runSmoothGliderLoop() {
      if (busCurrentPos && busTargetPos && animFraction < 1) {
        animFraction += 0.08;
        const currentLat = busCurrentPos.lat + (busTargetPos.lat - busCurrentPos.lat) * animFraction;
        const currentLng = busCurrentPos.lng + (busTargetPos.lng - busCurrentPos.lng) * animFraction;

        if (busMarker) busMarker.setLatLng([currentLat, currentLng]);

        if (routeLine && selectedPickupCoords) {
          routeLine.setLatLngs([[currentLat, currentLng], [selectedPickupCoords.lat, selectedPickupCoords.lng]]);
        }
      }
      requestAnimationFrame(runSmoothGliderLoop);
    }

    function toggleMapLayer() {
      const btn = document.getElementById('layerBtn');
      if (isSatellite) {
        map.removeLayer(googleHybridLayer);
        googleStreetsLayer.addTo(map);
        btn.innerText = "🛰️ Satellite";
        isSatellite = false;
      } else {
        map.removeLayer(googleStreetsLayer);
        googleHybridLayer.addTo(map);
        btn.innerText = "🗺️ Normal";
        isSatellite = true;
      }
    }

    function fetchUltraAccurateGPS() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 19, { animate: false });
          placeDraggablePin(pos.coords.latitude, pos.coords.longitude);
          document.getElementById('statusText').innerText = "🎯 Location mil gayi! Pin set karke 'Lock' dabayein.";
        },
        () => {},
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function placeDraggablePin(lat, lng) {
      selectedPickupCoords = { lat: parseFloat(lat), lng: parseFloat(lng) };
      const studentName = document.getElementById('studentName').value.trim() || 'Student';

      const customHtml = `
        <div class="custom-marker">
          <div class="marker-bubble home-bubble">🏠</div>
          <div class="marker-tag">🏠 ${studentName} ka Ghar</div>
        </div>
      `;

      const homeDivIcon = L.divIcon({
        className: 'clear-div-icon', html: customHtml, iconSize: [44, 65], iconAnchor: [22, 60]
      });

      if (!pickupMarker) {
        pickupMarker = L.marker([lat, lng], { icon: homeDivIcon, draggable: true }).addTo(map);
        pickupMarker.on('dragend', function (event) {
          const pos = event.target.getLatLng();
          selectedPickupCoords = { lat: pos.lat, lng: pos.lng };
          document.getElementById('statusText').innerText = `✅ Ghar Position Updated!`;
        });
      } else {
        pickupMarker.setLatLng([lat, lng]);
      }
    }

    async function savePickupToSupabase() {
      forceUnlockAudio();
      const studentName = document.getElementById('studentName').value.trim();
      if (!selectedPickupCoords) return alert("Pehle map par ghar chunein!");

      document.getElementById('statusText').innerText = "☁️ Supabase me lock ho raha hai...";

      const { error } = await sb.from('student_location').upsert({
        id: 'MAIN',
        student_name: studentName,
        lat: selectedPickupCoords.lat,
        lng: selectedPickupCoords.lng,
        updated_at: new Date()
      });

      if (error) {
        alert("Error: " + error.message);
      } else {
        hasAlertFired = false;
        alert(`✅ Pickup Point Locked!\nAb Phone 2 (Driver) se movement start karein.`);
        document.getElementById('statusText').innerText = `Ghar Lock! Driver live movement ka intezar...`;
      }
    }

    function listenToDriverBusRealtime() {
      if (realtimeChannel) sb.removeChannel(realtimeChannel);

      realtimeChannel = sb
        .channel('bus-stream-fail-safe')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'bus_location', filter: 'id=eq.MAIN' },
          (payload) => {
            lastHeartbeat = Date.now();
            const data = payload.new;
            if (data && data.lat && data.lng) {
              const newLat = parseFloat(data.lat);
              const newLng = parseFloat(data.lng);

              if (!busMarker) {
                const busHtml = `
                  <div class="custom-marker">
                    <div class="marker-bubble bus-bubble">🚌</div>
                    <div class="marker-tag bus-tag">🚌 ${data.bus_number || 'School Bus'} (LIVE)</div>
                  </div>
                `;
                const busDivIcon = L.divIcon({
                  className: 'clear-div-icon', html: busHtml, iconSize: [44, 65], iconAnchor: [22, 60]
                });
                busMarker = L.marker([newLat, newLng], { icon: busDivIcon }).addTo(map);
                busCurrentPos = { lat: newLat, lng: newLng };
                busTargetPos = { lat: newLat, lng: newLng };
              } else {
                busCurrentPos = busMarker.getLatLng();
                busTargetPos = { lat: newLat, lng: newLng };
                animFraction = 0;
              }

              if (selectedPickupCoords) {
                const dist = Math.round(getPreciseDistance(newLat, newLng, selectedPickupCoords.lat, selectedPickupCoords.lng));
                document.getElementById('distanceHud').innerText = `Doori: ${dist} m`;
                document.getElementById('statusText').innerText = `🚌 Live Doori: ${dist} Meters | Speed: ${Math.round(data.speed || 0)} km/h`;

                const threshold = parseInt(document.getElementById('alertThreshold').value) || 20;

                if (dist <= threshold && !hasAlertFired && !isSirenActive) {
                  const sName = document.getElementById('studentName').value.trim() || 'Student';
                  startGuaranteedSiren(sName);
                }
              }
            }
          }
        )
        .subscribe();
    }

    function getPreciseDistance(lat1, lon1, lat2, lon2) {
      lat1 = parseFloat(lat1); lon1 = parseFloat(lon1);
      lat2 = parseFloat(lat2); lon2 = parseFloat(lon2);
      if (isNaN(lat1) || isNaN(lon1) || isNaN(lat2) || isNaN(lon2)) return 999999;
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
