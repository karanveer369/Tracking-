<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>School Bus Tracker - Live Trail</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    #map { height: 100vh; width: 100vw; }
    
    .bottom-card {
      position: absolute; bottom: 0; width: 100%;
      background: white; border-radius: 25px 25px 0 0;
      padding: 20px 25px; box-shadow: 0 -10px 25px rgba(0,0,0,0.15);
      z-index: 1000; box-sizing: border-box;
      display: flex; justify-content: space-between; align-items: center;
    }
    .title-box { display: flex; flex-direction: column; gap: 4px; }
    .title { font-size: 18px; font-weight: bold; color: #1e293b; }
    
    .status { color: #16a34a; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    .telemetry-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .speed-badge { background: #dcfce7; color: #15803d; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 14px; }
    .coords-text { font-family: monospace; font-size: 11px; color: #64748b; background: #f8fafc; padding: 4px 8px; border-radius: 6px; border: 1.5px solid #e2e8f0; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="bottom-card">
    <div class="title-box">
      <div class="title">🚌 School Bus Tracker</div>
      <div class="status"><span class="dot"></span> Live Route Trail Active</div>
    </div>
    
    <div class="telemetry-panel">
      <div class="speed-badge">⚡ <span id="displaySpeed">0.0</span> Km/h</div>
      <div class="coords-text">Lat: <span id="latVal">0.00000</span> | Lng: <span id="lngVal">0.00000</span></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    var map = L.map('map', {zoomControl: false}).setView([26.9739, 81.9098], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // Stable, clean standard icon (No rotation glitches)
    var busIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
      iconSize: [42, 42],
      iconAnchor: [21, 21]
    });
    var busMarker = L.marker([26.9739, 81.9098], {icon: busIcon}).addTo(map);

    // ASLI OLA/UBER FEATURE: Live Route Trail (Bus ke peeche banne wali neeli raste ki line)
    var pathPoints = [];
    var routePolyline = L.polyline([], {
      color: '#2563eb', // Gorgeous blue route line
      weight: 6,
      opacity: 0.8,
      smoothFactor: 1
    }).addTo(map);

    const supabaseUrl = 'https://wavraoucbbabjzzzkzor.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdnJhb3VjYmJhYmp6enprem9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDE3MTQsImV4cCI6MjEwMzY3NzcxNH0.wYCB_LdoYkVywZrM27UHvpixsZ6qQbQrzd5hSpJSuoI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let targetLat = 26.9739, targetLng = 81.9098;
    let displayedLat = 26.9739, displayedLng = 81.9098;

    // 60 FPS Silky Smooth Glide Engine
    function startSmoothLoop() {
      displayedLat += (targetLat - displayedLat) * 0.25;
      displayedLng += (targetLng - displayedLng) * 0.25;

      busMarker.setLatLng([displayedLat, displayedLng]);
      requestAnimationFrame(startSmoothLoop);
    }
    startSmoothLoop();

    function updateLiveRoute(lat, lng, speed) {
      targetLat = lat;
      targetLng = lng;

      // Naye coordinate ko history array me dal kar neeli line update karo
      pathPoints.push([lat, lng]);
      routePolyline.setLatLngs(pathPoints);

      // Text UI update
      document.getElementById('latVal').innerText = Number(lat).toFixed(5);
      document.getElementById('lngVal').innerText = Number(lng).toFixed(5);

      if (speed !== undefined) {
        document.getElementById('displaySpeed').innerText = speed;
      }
    }

    async function init() {
      const { data, error } = await _supabase.from('bus_locations').select('lat, lng, speed').eq('bus_id', 'UP43_BUS_01').single();
      if (data && !error) {
        targetLat = data.lat;
        targetLng = data.lng;
        displayedLat = data.lat;
        displayedLng = data.lng;
        busMarker.setLatLng([data.lat, data.lng]);
        map.setView([data.lat, data.lng], 16);
        
        pathPoints.push([data.lat, data.lng]);
        routePolyline.setLatLngs(pathPoints);

        if(data.speed) document.getElementById('displaySpeed').innerText = data.speed;
      }
    }
    init();

    // Realtime WebSocket Listener
    _supabase
      .channel('bus_channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bus_locations', filter: 'bus_id=eq.UP43_BUS_01' }, 
        (payload) => {
          if (payload.new && payload.new.lat) {
            updateLiveRoute(payload.new.lat, payload.new.lng, payload.new.speed);
          }
        }
      )
      .subscribe();
  </script>
</body>
</html>
