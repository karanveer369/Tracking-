<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>School Bus Tracker - Google Maps Live</title>
  
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    
    /* Google Maps Iframe poori screen par chalega */
    #mapFrame { width: 100vw; height: 100vh; border: none; }
    
    .bottom-card {
      position: absolute; bottom: 0; width: 100%;
      background: white; border-radius: 25px 25px 0 0;
      padding: 20px 25px; box-shadow: 0 -10px 25px rgba(0,0,0,0.15);
      z-index: 1000; box-sizing: border-box;
      display: flex; justify-content: space-between; align-items: center;
    }
    .title-box { display: flex; flex-direction: column; gap: 4px; }
    .title { font-size: 18px; font-weight: bold; color: #1e293b; }
    
    .status { color: #16a34a; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    .telemetry-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .speed-badge { background: #dcfce7; color: #15803d; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 14px; }
    .coords-text { font-family: monospace; font-size: 11px; color: #64748b; background: #f8fafc; padding: 4px 8px; border-radius: 6px; border: 1.5px solid #e2e8f0; }

    /* Google Maps App kholne ka button */
    .btn-gmaps {
      margin-top: 4px;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Asli Google Maps Iframe jo live coordinates par re-center hoga -->
  <iframe id="mapFrame" src="https://maps.google.com/maps?q=26.9739,81.9098&z=17&output=embed"></iframe>

  <div class="bottom-card">
    <div class="title-box">
      <div class="title">🚌 School Bus Tracker</div>
      <div class="status"><span class="dot"></span> Live Google Maps</div>
      <!-- Asli Google Maps App me kholne ke liye button -->
      <a id="gmapsBtn" href="https://www.google.com/maps/search/?api=1&query=26.9739,81.9098" target="_blank" class="btn-gmaps">📍 Open in Maps App</a>
    </div>
    
    <div class="telemetry-panel">
      <div class="speed-badge">⚡ <span id="displaySpeed">0.0</span> Km/h</div>
      <div class="coords-text">Lat: <span id="latVal">0.00000</span> | Lng: <span id="lngVal">0.00000</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    const supabaseUrl = 'https://wavraoucbbabjzzzkzor.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdnJhb3VjYmJhYmp6enprem9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDE3MTQsImV4cCI6MjEwMzY3NzcxNH0.wYCB_LdoYkVywZrM27UHvpixsZ6qQbQrzd5hSpJSuoI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let lastLat = 0;
    let lastLng = 0;

    function updateGoogleMap(lat, lng, speed) {
      // Agar coordinate thode se bhi badle hain, toh Google Map ko naye point par refresh kar do
      if (Math.abs(lat - lastLat) > 0.00001 || Math.abs(lng - lastLng) > 0.00001) {
        lastLat = lat;
        lastLng = lng;
        
        // Google Maps iframe ka src update hoga taaki map wahan move ho jaye
        document.getElementById('mapFrame').src = `https://maps.google.com/maps?q=${lat},${lng}&z=17&output=embed`;
        
        // Button link update hoga
        document.getElementById('gmapsBtn').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      }

      // Text UI update
      document.getElementById('latVal').innerText = Number(lat).toFixed(5);
      document.getElementById('lngVal').innerText = Number(lng).toFixed(5);

      if (speed !== undefined) {
        document.getElementById('displaySpeed').innerText = speed;
      }
    }

    async function init() {
      const { data, error } = await _supabase.from('bus_locations').select('lat, lng, speed').eq('bus_id', 'UP43_BUS_01').single();
      if (data && !error) {
        updateGoogleMap(data.lat, data.lng, data.speed);
      }
    }
    init();

    // Supabase Realtime WebSocket Listener
    _supabase
      .channel('bus_channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bus_locations', filter: 'bus_id=eq.UP43_BUS_01' }, 
        (payload) => {
          if (payload.new && payload.new.lat) {
            updateGoogleMap(payload.new.lat, payload.new.lng, payload.new.speed);
          }
        }
      )
      .subscribe();
  </script>
</body>
</html>
