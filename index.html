<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Bus Tracker Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e293b, #0b1329);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid #334155;
      padding: 36px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h1 { font-size: 1.8rem; color: #f59e0b; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
    a.role-btn {
      display: block;
      text-decoration: none;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      transition: 0.2s;
    }
    .role-parent { background: #0284c7; color: white; }
    .role-driver { background: #f59e0b; color: #0f172a; }
    a.role-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚌 BusTrack Live</h1>
    <p>Apna role select karke aage badhein</p>
    
    <a href="parent.html" class="role-btn role-parent">👨‍👩‍👧 Parent Portal</a>
    <a href="driver.html" class="role-btn role-driver">🚍 Bus Driver Portal</a>
  </div>
</body>
</html>
