<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Bus Tracker - Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .bus-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .role-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }
    .role-btn:active {
      transform: scale(0.96);
    }
    .driver-btn {
      background: linear-gradient(135deg, #00a652, #059669);
      color: white;
      box-shadow: 0 8px 20px rgba(0, 166, 82, 0.3);
    }
    .parent-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="bus-icon">🚌</div>
    <h2>School Bus Tracker</h2>
    <p>Select your role to continue testing</p>

    <!-- Driver button links to driver.html -->
    <a href="driver.html" class="role-btn driver-btn">
      <span>👨‍✈️</span> Login as Driver
    </a>

    <!-- Parent button links to parent.html -->
    <a href="parent.html" class="role-btn parent-btn">
      <span>👪</span> Login as Parent
    </a>

    <div class="footer-note">Rapido Level Realtime Architecture</div>
  </div>

</body>
</html>
