<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver App - Instant Turbo</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100vh; box-sizing: border-box; }
    .card { background: #1e293b; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { margin-bottom: 5px; color: #38bdf8; }
    .status-box { margin: 20px 0; padding: 15px; border-radius: 12px; background: #0f172a; border: 1px solid #22c55e; display: none; }
    .coords { font-size: 13px; color: #94a3b8; margin-top: 8px; font-family: monospace; }
    .speed-text { font-size: 24px; color: #22c55e; margin: 5px 0; font-weight: bold; }
    #dbStatus { display: block; margin-top: 10px; font-size: 13px; font-weight: bold; }
    
    button { padding: 16px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 50px; cursor: pointer; width: 100%; transition: 0.2s; }
    #startBtn { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }
    #stopBtn { background: linear-gradient(135deg, #ef4444, #dc2626); display: none; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ Driver Radar Mode</h2>
    <p style="color: #94a3b8; font-size: 14px;">Instant Micro-Sync Enabled</p>
    
    <div id="statusBox" class="status-box">
      <div class="speed-text">⚡ <span id="speedVal">0.0</span> Km/h</div>
      <div id="coords" class="coords">Lat: 0.00000 | Lng: 0.00000</div>
      <span id="dbStatus">🟢 Active</span>
    </div>

    <button id="startBtn" onclick="startTracking()">🚀 Start Trip</button>
    <button id="stopBtn" onclick="stopTracking()">🛑 End Trip</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl = 'https://wavraoucbbabjzzzkzor.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdnJhb3VjYmJhYmp6enprem9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDE3MTQsImV4cCI6MjEwMzY3NzcxNH0.wYCB_LdoYkVywZrM27UHvpixsZ6qQbQrzd5hSpJSuoI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let watchId = null;
    let lastLat = 0;
    let lastLng = 0;
    let lastSendTime = 0;

    function startTracking() {
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      document.getElementById('statusBox').style.display = 'block';
      
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(console.error);
      }

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const rawSpeed = pos.coords.speed || 0;
            const speed = (rawSpeed * 3.6).toFixed(1);

            document.getElementById('coords').innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
            document.getElementById('speedVal').innerText = speed;

            // Micro-change detection: Agar 0.00001 bhi hila aur 400ms beete hain, turant bhej do
            const now = Date.now();
            const delta = Math.abs(lat - lastLat) + Math.abs(lng - lastLng);

            if (delta > 0.000005 || (now - lastSendTime > 1500)) {
              lastLat = lat;
              lastLng = lng;
              lastSendTime = now;

              const { error } = await _supabase
                .from('bus_locations')
                .upsert({ bus_id: 'UP43_BUS_01', lat: lat, lng: lng, speed: speed }, { onConflict: 'bus_id' });

              if (!error) {
                document.getElementById('dbStatus').innerText = "⚡ Pushed Live Micro-Coordinate!";
                document.getElementById('dbStatus').style.color = "#22c55e";
              }
            }
          },
          (err) => console.log("GPS Err:", err),
          { enableHighAccuracy: true, maximumAge: 0 }
        );
      }
    }

    function stopTracking() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('statusBox').style.display = 'none';
    }
  </script>
</body>
</html>
